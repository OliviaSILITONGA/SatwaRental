<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SatwaRental</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">Satwa<span>Rental</span></a>
    <div class="nav-links">
      <a href="index.html" id="nav-beranda">Beranda</a>
      <a href="barang.html" id="nav-kendaraan">Kendaraan</a>
      <a href="tentang.html" id="nav-tentang">Tentang</a>
      <a href="syarat.html" id="nav-syarat">Syarat & Ketentuan</a>
    </div>
    <div class="nav-cta">
      <button class="btn btn-ghost" onclick="location.href='login.html'">Masuk</button>
      <button class="btn btn-primary" onclick="location.href='register.html'" style="background:transparent;color:var(--blue);border-color:var(--blue);">Daftar</button>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<div class="auth-page">
  <div class="auth-card">
    <h2>Buat Akun</h2>
    <p>Daftar sebagai mahasiswa terverifikasi</p>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <div class="input-icon">
        <span class="icon">👤</span>
        <input type="text" placeholder="Nama sesuai KTM">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <div class="input-icon">
        <span class="icon">📧</span>
        <input type="email" placeholder="email@mahasiswa.ac.id">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-icon">
        <span class="icon">🔒</span>
        <input type="password" placeholder="Min. 8 karakter">
      </div>
    </div>
    <div class="form-group">
      <label>Upload Foto KTM <span style="color:var(--red)">*</span></label>
      <div style="border:2px dashed var(--blue-mid);border-radius:var(--radius-sm);padding:24px;text-align:center;background:var(--blue-light);cursor:pointer;" onclick="showToast('📁 File KTM dipilih')">
        <div style="font-size:28px;margin-bottom:8px;">🪪</div>
        <p style="font-size:13px;color:var(--blue);font-weight:600;margin:0;">Klik untuk upload KTM</p>
        <p style="font-size:11px;color:var(--text-muted);margin:4px 0 0;">JPG, PNG · Max 5MB</p>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;" onclick="showToast('🎉 Akun dibuat! Menunggu verifikasi KTM.')">Daftar Sekarang</button>
    <div class="auth-footer">Sudah punya akun? <a href="login.html">Masuk di sini</a></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
